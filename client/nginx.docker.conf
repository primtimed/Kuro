server {
    listen 80;
    root /usr/share/nginx/html;

    # The JS bundle and API JSON shrink ~70% compressed — matters most on TVs and phones over LAN
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://server:3002;
        proxy_http_version 1.1;
        # $http_host keeps the port (localhost:7000), which the server needs for its
        # same-origin check and for building invite links
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Video and HLS responses must stream through, not buffer
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes like /watch/:id resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current hashed bundles; revalidate it so a reload picks up new deploys
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
